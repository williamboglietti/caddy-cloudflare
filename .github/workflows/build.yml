name: build

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [dev, main]
  # Vérifie toutes les six heures les versions publiées de Caddy et du module DNS.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      caddy_version:
        description: "Version Caddy à compiler (vide = dernière version stable)"
        required: false
        type: string

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' && format('caddy-dev-pr-{0}', github.event.pull_request.number) || 'caddy-cloudflare-release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' }}

env:
  IMAGE_DOCKERHUB: williamboglietti/caddy-cloudflare
  IMAGE_GHCR: ghcr.io/williamboglietti/caddy-cloudflare

jobs:
  classify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check documentation and classify changes
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # After this workflow has landed, use the base branch's policy, so a
          # PR cannot weaken the classifier and label its own changes as docs.
          if git cat-file -e "$BASE_SHA:scripts/classify_changes.py" 2>/dev/null; then
            git show "$BASE_SHA:scripts/classify_changes.py" > "$RUNNER_TEMP/classify_changes.py"
            python3 "$RUNNER_TEMP/classify_changes.py"
          else
            python3 scripts/classify_changes.py
          fi

  quality:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test CI helpers
        run: python3 -m unittest discover -s tests -v
      - name: Check workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.9

  prepare:
    needs: classify
    if: always() && (github.event_name != 'pull_request' || (github.base_ref != 'dev' && needs.classify.result == 'success' && needs.classify.outputs.scope == 'full'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_build: ${{ steps.release.outputs.should_build }}
      candidate_suffix: ${{ steps.release.outputs.candidate_suffix }}
      caddy: ${{ steps.version.outputs.caddy }}
      caddy_base: ${{ steps.version.outputs.caddy_base }}
      cloudflare_dns: ${{ steps.version.outputs.cloudflare_dns }}
      builder_digest: ${{ steps.version.outputs.builder_digest }}
      runtime_digest: ${{ steps.version.outputs.runtime_digest }}
      published_pair_tag: ${{ steps.version.outputs.published_pair_tag }}
      labels: ${{ steps.meta.outputs.labels }}
      tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # La version du binaire suit toujours la dernière release stable de Caddy.
      # Les images officielles disponibles servent de builder et de runtime;
      # xcaddy compile la version officielle même si son tag Docker tarde.
      - name: Resolve Caddy and Cloudflare versions
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_VERSION: ${{ inputs.caddy_version }}
        run: |
          # Évite le quota anonyme partagé par les runners GitHub Actions.
          releases="$(curl -fsSL --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            'https://api.github.com/repos/caddyserver/caddy/releases?per_page=100')"
          release_versions="$(jq -r '.[] | select(.draft == false and .prerelease == false) | .tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | sub("^v"; "")' <<< "$releases")"
          latest_release="$(sed -n '1p' <<< "$release_versions")"

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            caddy="${GITHUB_REF_NAME#v}"
          elif [[ -n "$REQUESTED_VERSION" ]]; then
            caddy="${REQUESTED_VERSION#v}"
          else
            caddy="$latest_release"
          fi

          if [[ -z "$caddy" ]]; then
            echo "Aucune release stable de Caddy n'a été trouvée." >&2
            exit 1
          fi

          # Le builder/runtime officiel le plus récent reste une base valable
          # pendant le délai de publication de la nouvelle image officielle.
          caddy_base=""
          while IFS= read -r candidate; do
            runtime_status="$(curl --max-time 20 -sS -o /dev/null -w '%{http_code}' "https://hub.docker.com/v2/repositories/library/caddy/tags/${candidate}")"
            builder_status="$(curl --max-time 20 -sS -o /dev/null -w '%{http_code}' "https://hub.docker.com/v2/repositories/library/caddy/tags/${candidate}-builder")"
            if [[ "$runtime_status" == "200" && "$builder_status" == "200" ]]; then
              caddy_base="$candidate"
              runtime_info="$(curl -fsSL --retry 3 "https://hub.docker.com/v2/repositories/library/caddy/tags/${candidate}")"
              builder_info="$(curl -fsSL --retry 3 "https://hub.docker.com/v2/repositories/library/caddy/tags/${candidate}-builder")"
              runtime_digest="$(jq -r '.digest // empty' <<< "$runtime_info")"
              builder_digest="$(jq -r '.digest // empty' <<< "$builder_info")"
              break
            fi
          done <<< "$release_versions"
          if [[ -z "$caddy_base" || ! "$runtime_digest" =~ ^sha256:[0-9a-f]{64}$ || ! "$builder_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Impossible de trouver les images officielles Caddy builder/runtime et leurs digests." >&2
            exit 1
          fi
          if [[ "$caddy" != "$caddy_base" ]]; then
            echo "Caddy ${caddy} sera compilé depuis sa release officielle avec le builder officiel ${caddy_base}; l'image runtime officielle ${caddy_base} servira de base."
          fi

          cloudflare="$(curl -fsSL --retry 3 'https://proxy.golang.org/github.com/caddy-dns/cloudflare/@latest' | jq -r '.Version')"

          if [[ ! "$caddy" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version Caddy invalide : $caddy" >&2
            exit 1
          fi
          if [[ ! "$caddy_base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version de l'image officielle Caddy invalide : $caddy_base" >&2
            exit 1
          fi
          if [[ ! "$cloudflare" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version du module Cloudflare invalide : $cloudflare" >&2
            exit 1
          fi

          IFS='.' read -r major minor _ <<< "$caddy"
          runtime_fingerprint="${runtime_digest#sha256:}"
          builder_fingerprint="${builder_digest#sha256:}"
          {
            echo "caddy=$caddy"
            echo "caddy_base=$caddy_base"
            echo "cloudflare_dns=$cloudflare"
            echo "runtime_digest=$runtime_digest"
            echo "builder_digest=$builder_digest"
            echo "published_pair_tag=auto-caddy-${caddy}-cloudflare-${cloudflare}-base-${caddy_base}-${runtime_fingerprint:0:12}-${builder_fingerprint:0:12}"
            echo "major=$major"
            echo "major_minor=$major.$minor"
          } >> "$GITHUB_OUTPUT"

      - name: Skip an already published version pair or pending Docker image
        id: release
        env:
          CADDY_VERSION: ${{ steps.version.outputs.caddy }}
          CLOUDFLARE_DNS_VERSION: ${{ steps.version.outputs.cloudflare_dns }}
          PUBLISHED_PAIR_TAG: ${{ steps.version.outputs.published_pair_tag }}
          REQUESTED_VERSION: ${{ inputs.caddy_version }}
        run: |
          should_build=true
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]] || [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -z "$REQUESTED_VERSION" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/${PUBLISHED_PAIR_TAG}" >/dev/null 2>&1; then
              echo "La paire Caddy ${CADDY_VERSION} / Cloudflare ${CLOUDFLARE_DNS_VERSION} est déjà publiée."
              should_build=false
            fi
          fi

          {
            echo "should_build=$should_build"
            echo "candidate_suffix=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        if: steps.release.outputs.should_build == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.IMAGE_DOCKERHUB }}
            ${{ env.IMAGE_GHCR }}
          tags: |
            type=raw,value=${{ steps.version.outputs.caddy }}
            type=raw,value=${{ steps.version.outputs.major_minor }}
            type=raw,value=${{ steps.version.outputs.major }}
            type=raw,value=latest

  build:
    name: Build and scan (${{ matrix.arch }})
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.prepare.outputs.should_build == 'true' }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            cache_scope: buildkit
          - arch: arm64
            runner: ubuntu-24.04-arm
            cache_scope: caddy-cloudflare-linux-arm64-native
    env:
      ARCH: ${{ matrix.arch }}
      CANDIDATE_SUFFIX: ${{ needs.prepare.outputs.candidate_suffix }}
      CANDIDATE_IMAGE: caddy-cloudflare:scan-${{ needs.prepare.outputs.candidate_suffix }}-${{ matrix.arch }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build candidate on native runner
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          pull: true
          tags: ${{ env.CANDIDATE_IMAGE }}
          labels: ${{ needs.prepare.outputs.labels }}
          build-args: |
            CADDY_VERSION=${{ needs.prepare.outputs.caddy }}
            CADDY_BUILDER_IMAGE=caddy:${{ needs.prepare.outputs.caddy_base }}-builder@${{ needs.prepare.outputs.builder_digest }}
            CADDY_RUNTIME_IMAGE=caddy:${{ needs.prepare.outputs.caddy_base }}@${{ needs.prepare.outputs.runtime_digest }}
            CLOUDFLARE_DNS_VERSION=${{ needs.prepare.outputs.cloudflare_dns }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache_scope }}

      - name: Verify Caddy version and Cloudflare module
        env:
          CADDY_VERSION: ${{ needs.prepare.outputs.caddy }}
          CLOUDFLARE_DNS_VERSION: ${{ needs.prepare.outputs.cloudflare_dns }}
        run: |
          docker run --rm "$CANDIDATE_IMAGE" caddy version | grep -F "v${CADDY_VERSION}"
          docker run --rm "$CANDIDATE_IMAGE" caddy list-modules --versions | grep -Fx "dns.providers.cloudflare ${CLOUDFLARE_DNS_VERSION}"

      - name: Validate a Caddyfile using the Cloudflare DNS provider
        run: |
          cat > "$RUNNER_TEMP/Caddyfile" <<'EOF'
          example.com {
              tls {
                  dns cloudflare {env.CF_API_TOKEN}
              }
              respond "ok"
          }
          EOF
          docker run --rm \
            -v "$RUNNER_TEMP/Caddyfile:/etc/caddy/Caddyfile" \
            "$CANDIDATE_IMAGE" \
            caddy fmt --overwrite /etc/caddy/Caddyfile
          docker run --rm \
            -e CF_API_TOKEN=0000000000000000000000000000000000000000 \
            -v "$RUNNER_TEMP/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$CANDIDATE_IMAGE" \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Installer Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
          cache: false

      - name: Scan the candidate with Trivy
        run: bash scripts/scan_candidates.sh "$CANDIDATE_SUFFIX" "$ARCH"

      - name: Export the scanned candidate
        run: docker save --output "$RUNNER_TEMP/candidate-$ARCH.tar" "$CANDIDATE_IMAGE"

      - name: Preserve the scanned candidate for assembly
        uses: actions/upload-artifact@v7
        with:
          name: candidate-${{ env.CANDIDATE_SUFFIX }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/candidate-${{ matrix.arch }}.tar
          if-no-files-found: error
          overwrite: true
          retention-days: 3
          compression-level: 1

  assemble:
    name: Verify candidates and publish on release events
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      CANDIDATE_SUFFIX: ${{ needs.prepare.outputs.candidate_suffix }}

    steps:
      - name: Download the scanned candidates
        uses: actions/download-artifact@v8
        with:
          pattern: candidate-${{ env.CANDIDATE_SUFFIX }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/candidates

      - name: Load and verify both candidates
        shell: bash
        run: |
          for arch in amd64 arm64; do
            docker load --input "$RUNNER_TEMP/candidates/candidate-$arch.tar"
            platform="$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "caddy-cloudflare:scan-$CANDIDATE_SUFFIX-$arch")"
            [[ "$platform" == "linux/$arch" ]]
          done

      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request'
        with:
          persist-credentials: false

      - name: Set up Buildx
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      # Les deux architectures sont publiées uniquement après la réussite des scans.
      - name: Login to Docker Hub after both scans pass
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR after both scans pass
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned candidates and publish multiarch tags
        if: github.event_name != 'pull_request'
        env:
          DOCKERHUB: ${{ env.IMAGE_DOCKERHUB }}
          GHCR: ${{ env.IMAGE_GHCR }}
          TAGS: ${{ needs.prepare.outputs.tags }}
          RUN_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          amd64_local="caddy-cloudflare:scan-$CANDIDATE_SUFFIX-amd64"
          arm64_local="caddy-cloudflare:scan-$CANDIDATE_SUFFIX-arm64"
          for registry in "$DOCKERHUB" "$GHCR"; do
            amd64="$registry:candidate-$RUN_SUFFIX-amd64"
            arm64="$registry:candidate-$RUN_SUFFIX-arm64"
            docker tag "$amd64_local" "$amd64"
            docker tag "$arm64_local" "$arm64"
            docker push "$amd64"
            docker push "$arm64"
          done

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            case "$tag" in
              "$DOCKERHUB":*) registry="$DOCKERHUB" ;;
              "$GHCR":*) registry="$GHCR" ;;
              *) echo "::error::Tag de registre inattendu : $tag"; exit 1 ;;
            esac
            docker buildx imagetools create --tag "$tag" \
              "$registry:candidate-$RUN_SUFFIX-amd64" \
              "$registry:candidate-$RUN_SUFFIX-arm64"
          done <<< "$TAGS"

      # Le marqueur inclut aussi les digests des bases: une mise à jour de
      # l'image officielle déclenche donc un nouveau build, même à versions égales.
      - name: Record the published Caddy, Cloudflare, and base images
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PAIR_TAG: ${{ needs.prepare.outputs.published_pair_tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${PUBLISHED_PAIR_TAG}" >/dev/null 2>&1; then
            echo "Le marqueur ${PUBLISHED_PAIR_TAG} existe déjà."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${PUBLISHED_PAIR_TAG}" -f sha="${GITHUB_SHA}"
          fi

  verify-published-scan:
    if: github.event_name == 'pull_request' && github.base_ref != 'dev' && needs.classify.result == 'success' && needs.classify.outputs.scope == 'full'
    needs: classify
    permissions:
      contents: read
    uses: ./.github/workflows/scan-published.yml

  ci-complete:
    name: CI complete
    if: always() && github.event_name == 'pull_request'
    needs: [classify, quality, prepare, build, assemble, verify-published-scan]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require the checks for this change
        env:
          CLASSIFY: ${{ needs.classify.result }}
          SCOPE: ${{ needs.classify.outputs.scope }}
          QUALITY: ${{ needs.quality.result }}
          QUICK: ${{ github.event_name == 'pull_request' && github.base_ref == 'dev' }}
          PREPARE: ${{ needs.prepare.result }}
          BUILD: ${{ needs.build.result }}
          ASSEMBLE: ${{ needs.assemble.result }}
          PUBLISHED_SCAN: ${{ needs.verify-published-scan.result }}
        run: |
          set -euo pipefail
          [[ "$CLASSIFY" == success && "$QUALITY" == success ]]
          if [[ "$SCOPE" == docs || ( "$SCOPE" == full && "$QUICK" == true ) ]]; then
            [[ "$PREPARE" == skipped && "$BUILD" == skipped && "$ASSEMBLE" == skipped && "$PUBLISHED_SCAN" == skipped ]]
          elif [[ "$SCOPE" == full ]]; then
            [[ "$PREPARE" == success && "$BUILD" == success && "$ASSEMBLE" == success && "$PUBLISHED_SCAN" == success ]]
          else
            echo "Périmètre CI invalide : $SCOPE" >&2
            exit 1
          fi
