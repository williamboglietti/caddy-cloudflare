name: build

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]
  # Vérifie toutes les six heures les versions publiées de Caddy et du module DNS.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      caddy_version:
        description: "Version Caddy à compiler (vide = dernière version stable)"
        required: false
        type: string

concurrency:
  group: caddy-cloudflare-release
  cancel-in-progress: false

env:
  IMAGE_DOCKERHUB: williamboglietti/caddy-cloudflare
  IMAGE_GHCR: ghcr.io/williamboglietti/caddy-cloudflare

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # nécessaire pour enregistrer le tag de la version publiée
      packages: write # nécessaire pour pousser sur GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # La version du binaire suit toujours la dernière release stable de Caddy.
      # Les images officielles disponibles servent de builder et de runtime;
      # xcaddy compile la version officielle même si son tag Docker tarde.
      - name: Resolve Caddy and Cloudflare versions
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_VERSION: ${{ inputs.caddy_version }}
        run: |
          # Évite le quota anonyme partagé par les runners GitHub Actions.
          releases="$(curl -fsSL --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            'https://api.github.com/repos/caddyserver/caddy/releases?per_page=100')"
          release_versions="$(jq -r '.[] | select(.draft == false and .prerelease == false) | .tag_name | select(test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")) | sub("^v"; "")' <<< "$releases")"
          latest_release="$(sed -n '1p' <<< "$release_versions")"

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            caddy="${GITHUB_REF_NAME#v}"
          elif [[ -n "$REQUESTED_VERSION" ]]; then
            caddy="${REQUESTED_VERSION#v}"
          else
            caddy="$latest_release"
          fi

          if [[ -z "$caddy" ]]; then
            echo "Aucune release stable de Caddy n'a été trouvée." >&2
            exit 1
          fi

          # Le builder/runtime officiel le plus récent reste une base valable
          # pendant le délai de publication de la nouvelle image officielle.
          caddy_base=""
          while IFS= read -r candidate; do
            runtime_status="$(curl --max-time 20 -sS -o /dev/null -w '%{http_code}' "https://hub.docker.com/v2/repositories/library/caddy/tags/${candidate}")"
            builder_status="$(curl --max-time 20 -sS -o /dev/null -w '%{http_code}' "https://hub.docker.com/v2/repositories/library/caddy/tags/${candidate}-builder")"
            if [[ "$runtime_status" == "200" && "$builder_status" == "200" ]]; then
              caddy_base="$candidate"
              runtime_info="$(curl -fsSL --retry 3 "https://hub.docker.com/v2/repositories/library/caddy/tags/${candidate}")"
              builder_info="$(curl -fsSL --retry 3 "https://hub.docker.com/v2/repositories/library/caddy/tags/${candidate}-builder")"
              runtime_digest="$(jq -r '.digest // empty' <<< "$runtime_info")"
              builder_digest="$(jq -r '.digest // empty' <<< "$builder_info")"
              break
            fi
          done <<< "$release_versions"
          if [[ -z "$caddy_base" || ! "$runtime_digest" =~ ^sha256:[0-9a-f]{64}$ || ! "$builder_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Impossible de trouver les images officielles Caddy builder/runtime et leurs digests." >&2
            exit 1
          fi
          if [[ "$caddy" != "$caddy_base" ]]; then
            echo "Caddy ${caddy} sera compilé depuis sa release officielle avec le builder officiel ${caddy_base}; l'image runtime officielle ${caddy_base} servira de base."
          fi

          cloudflare="$(curl -fsSL --retry 3 'https://proxy.golang.org/github.com/caddy-dns/cloudflare/@latest' | jq -r '.Version')"

          if [[ ! "$caddy" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version Caddy invalide : $caddy" >&2
            exit 1
          fi
          if [[ ! "$caddy_base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version de l'image officielle Caddy invalide : $caddy_base" >&2
            exit 1
          fi
          if [[ ! "$cloudflare" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Version du module Cloudflare invalide : $cloudflare" >&2
            exit 1
          fi

          IFS='.' read -r major minor _ <<< "$caddy"
          runtime_fingerprint="${runtime_digest#sha256:}"
          builder_fingerprint="${builder_digest#sha256:}"
          {
            echo "caddy=$caddy"
            echo "caddy_base=$caddy_base"
            echo "cloudflare_dns=$cloudflare"
            echo "runtime_digest=$runtime_digest"
            echo "builder_digest=$builder_digest"
            echo "published_pair_tag=auto-caddy-${caddy}-cloudflare-${cloudflare}-base-${caddy_base}-${runtime_fingerprint:0:12}-${builder_fingerprint:0:12}"
            echo "major=$major"
            echo "major_minor=$major.$minor"
          } >> "$GITHUB_OUTPUT"

      - name: Skip an already published version pair or pending Docker image
        id: release
        env:
          CADDY_VERSION: ${{ steps.version.outputs.caddy }}
          CLOUDFLARE_DNS_VERSION: ${{ steps.version.outputs.cloudflare_dns }}
          PUBLISHED_PAIR_TAG: ${{ steps.version.outputs.published_pair_tag }}
          REQUESTED_VERSION: ${{ inputs.caddy_version }}
        run: |
          should_build=true
          if [[ "$GITHUB_EVENT_NAME" == "schedule" ]] || [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && -z "$REQUESTED_VERSION" ]]; then
            if git ls-remote --exit-code --tags origin "refs/tags/${PUBLISHED_PAIR_TAG}" >/dev/null 2>&1; then
              echo "La paire Caddy ${CADDY_VERSION} / Cloudflare ${CLOUDFLARE_DNS_VERSION} est déjà publiée."
              should_build=false
            fi
          fi

          echo "should_build=$should_build" >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        if: steps.release.outputs.should_build == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_DOCKERHUB }}
            ${{ env.IMAGE_GHCR }}
          tags: |
            type=raw,value=${{ steps.version.outputs.caddy }}
            type=raw,value=${{ steps.version.outputs.major_minor }}
            type=raw,value=${{ steps.version.outputs.major }}
            type=raw,value=latest

      - name: Set up QEMU
        if: steps.release.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: steps.release.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v3

      # Le build amd64 sert de smoke test ; aucune image n'est publiée avant
      # d'avoir vérifié le binaire, le module et une configuration Caddyfile.
      - name: Build amd64 for smoke test
        if: steps.release.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          pull: true
          tags: caddy-cloudflare:scan-${{ github.run_id }}-${{ github.run_attempt }}-amd64
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CADDY_VERSION=${{ steps.version.outputs.caddy }}
            CADDY_BUILDER_IMAGE=caddy:${{ steps.version.outputs.caddy_base }}-builder@${{ steps.version.outputs.builder_digest }}
            CADDY_RUNTIME_IMAGE=caddy:${{ steps.version.outputs.caddy_base }}@${{ steps.version.outputs.runtime_digest }}
            CLOUDFLARE_DNS_VERSION=${{ steps.version.outputs.cloudflare_dns }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Caddy version and Cloudflare module
        if: steps.release.outputs.should_build == 'true'
        env:
          CADDY_VERSION: ${{ steps.version.outputs.caddy }}
          CLOUDFLARE_DNS_VERSION: ${{ steps.version.outputs.cloudflare_dns }}
          SMOKE_IMAGE: caddy-cloudflare:scan-${{ github.run_id }}-${{ github.run_attempt }}-amd64
        run: |
          docker run --rm "$SMOKE_IMAGE" caddy version | grep -F "v${CADDY_VERSION}"
          docker run --rm "$SMOKE_IMAGE" caddy list-modules --versions | grep -Fx "dns.providers.cloudflare ${CLOUDFLARE_DNS_VERSION}"

      - name: Validate a Caddyfile using the Cloudflare DNS provider
        if: steps.release.outputs.should_build == 'true'
        env:
          SMOKE_IMAGE: caddy-cloudflare:scan-${{ github.run_id }}-${{ github.run_attempt }}-amd64
        run: |
          cat > "$RUNNER_TEMP/Caddyfile" <<'EOF'
          example.com {
              tls {
                  dns cloudflare {env.CF_API_TOKEN}
              }
              respond "ok"
          }
          EOF
          docker run --rm \
            -v "$RUNNER_TEMP/Caddyfile:/etc/caddy/Caddyfile" \
            "$SMOKE_IMAGE" \
            caddy fmt --overwrite /etc/caddy/Caddyfile
          docker run --rm \
            -e CF_API_TOKEN=0000000000000000000000000000000000000000 \
            -v "$RUNNER_TEMP/Caddyfile:/etc/caddy/Caddyfile:ro" \
            "$SMOKE_IMAGE" \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Installer Trivy
        if: steps.release.outputs.should_build == 'true'
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.75.0
          cache: false

      - name: Bloquer les vulnérabilités HIGH/CRITICAL corrigibles amd64
        if: steps.release.outputs.should_build == 'true'
        env:
          CANDIDATE: caddy-cloudflare:scan-${{ github.run_id }}-${{ github.run_attempt }}-amd64
        run: trivy image --platform linux/amd64 --scanners vuln --vuln-type os,library --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$CANDIDATE"

      - name: Build arm64 candidate locally
        if: steps.release.outputs.should_build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          pull: true
          tags: caddy-cloudflare:scan-${{ github.run_id }}-${{ github.run_attempt }}-arm64
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CADDY_VERSION=${{ steps.version.outputs.caddy }}
            CADDY_BUILDER_IMAGE=caddy:${{ steps.version.outputs.caddy_base }}-builder@${{ steps.version.outputs.builder_digest }}
            CADDY_RUNTIME_IMAGE=caddy:${{ steps.version.outputs.caddy_base }}@${{ steps.version.outputs.runtime_digest }}
            CLOUDFLARE_DNS_VERSION=${{ steps.version.outputs.cloudflare_dns }}
          cache-from: type=gha,scope=caddy-cloudflare-linux-arm64
          cache-to: type=gha,mode=max,scope=caddy-cloudflare-linux-arm64

      - name: Bloquer les vulnérabilités HIGH/CRITICAL corrigibles arm64
        if: steps.release.outputs.should_build == 'true'
        env:
          CANDIDATE: caddy-cloudflare:scan-${{ github.run_id }}-${{ github.run_attempt }}-arm64
        run: trivy image --platform linux/arm64 --scanners vuln --vuln-type os,library --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$CANDIDATE"

      # Les deux architectures sont publiées uniquement après la réussite des scans.
      - name: Login to Docker Hub after both scans pass
        if: steps.release.outputs.should_build == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GHCR after both scans pass
        if: steps.release.outputs.should_build == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned candidates and publish multiarch tags
        if: steps.release.outputs.should_build == 'true' && github.event_name != 'pull_request'
        env:
          DOCKERHUB: ${{ env.IMAGE_DOCKERHUB }}
          GHCR: ${{ env.IMAGE_GHCR }}
          TAGS: ${{ steps.meta.outputs.tags }}
          RUN_SUFFIX: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          amd64_local="caddy-cloudflare:scan-$RUN_SUFFIX-amd64"
          arm64_local="caddy-cloudflare:scan-$RUN_SUFFIX-arm64"
          for registry in "$DOCKERHUB" "$GHCR"; do
            amd64="$registry:candidate-$RUN_SUFFIX-amd64"
            arm64="$registry:candidate-$RUN_SUFFIX-arm64"
            docker tag "$amd64_local" "$amd64"
            docker tag "$arm64_local" "$arm64"
            docker push "$amd64"
            docker push "$arm64"
          done

          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            case "$tag" in
              "$DOCKERHUB":*) registry="$DOCKERHUB" ;;
              "$GHCR":*) registry="$GHCR" ;;
              *) echo "::error::Tag de registre inattendu : $tag"; exit 1 ;;
            esac
            docker buildx imagetools create --tag "$tag" \
              "$registry:candidate-$RUN_SUFFIX-amd64" \
              "$registry:candidate-$RUN_SUFFIX-arm64"
          done <<< "$TAGS"

      # Le marqueur inclut aussi les digests des bases: une mise à jour de
      # l'image officielle déclenche donc un nouveau build, même à versions égales.
      - name: Record the published Caddy, Cloudflare, and base images
        if: steps.release.outputs.should_build == 'true' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PAIR_TAG: ${{ steps.version.outputs.published_pair_tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${PUBLISHED_PAIR_TAG}" >/dev/null 2>&1; then
            echo "Le marqueur ${PUBLISHED_PAIR_TAG} existe déjà."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${PUBLISHED_PAIR_TAG}" -f sha="${GITHUB_SHA}"
          fi
